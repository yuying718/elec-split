<title>elec-split</title>
<style>
  :root{
    --bg: #161514;
    --panel: #232220;
    --panel-2: #2e2c29;
    --line: #524d45;
    --line-soft: #3a3733;
    --text: #ede9e2;
    --muted: #a29c90;
    --copper: #d98a3d;
    --copper-bright: #f0a94e;
    --teal: #4fb0ae;
    --gold: #e8c063;
    --danger: #c85c4a;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #262421 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
    padding: calc(20px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:20px;}
  .header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  header .eyebrow{
    font-size:11px;letter-spacing:.18em;color:var(--copper-bright);
    text-transform:uppercase;font-weight:600;
  }
  h1{font-size:22px;margin:4px 0 2px;font-weight:700;}
  header p{color:var(--muted);font-size:13px;margin:0;}
  .btn-settings{
    flex-shrink:0;background:var(--panel);border:1px solid var(--line);
    color:var(--text);border-radius:20px;padding:7px 14px;
    font-size:12.5px;cursor:pointer;white-space:nowrap;
  }
  .btn-settings:active{opacity:.75;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .card h2{
    font-size:13px;letter-spacing:.06em;color:var(--muted);
    text-transform:uppercase;margin:0 0 14px;font-weight:600;
  }

  /* 電表儀表區 */
  .meters{display:flex;flex-direction:column;gap:12px;}
  @media (min-width:600px){
    .meters{flex-direction:row;flex-wrap:wrap;}
  }
  .meter{
    flex:none;width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:8px;padding:14px 12px;
  }
  @media (min-width:600px){
    .meter{flex:1 1 220px;width:auto;}
  }
  .meter .label{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .meter .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.tenant{background:var(--teal);}
  .digits{
    display:flex;gap:2px;font-family:"SF Mono","Courier New",monospace;flex-wrap:wrap;
  }
  .digit{
    background:#141312;border:1px solid var(--line);
    border-radius:3px;padding:6px 4px;min-width:16px;
    text-align:center;font-size:18px;font-weight:700;
    font-variant-numeric: tabular-nums;
  }
  .meter .date-note{margin-top:8px;font-size:11px;color:var(--muted);}

  /* 最新分攤結果 */
  .split-summary{display:flex;flex-direction:column;gap:12px;}
  @media (min-width:600px){
    .split-summary{flex-direction:row;flex-wrap:wrap;}
  }
  .split-box{
    flex:none;width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:8px;padding:12px;
  }
  @media (min-width:600px){
    .split-box{flex:1 1 140px;width:auto;}
  }
  .split-box .who{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .split-box .amount{font-size:20px;font-weight:700;font-variant-numeric: tabular-nums;}
  .split-box .usage{font-size:11px;color:var(--muted);margin-top:4px;}
  .split-box.tenant .amount{color:var(--teal);}
  .split-box.self .amount{color:var(--gold);}

  /* 表單 */
  .form-grid{display:grid;grid-template-columns:1fr;gap:18px;}
  @media (min-width:600px){
    .form-grid{grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:18px 12px;}
  }
  .form-grid .full{grid-column:1/-1;}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;}
  input{
    width:100%;height:48px;background:#0e0d0c;border:1px solid var(--line);
    color:var(--text);border-radius:6px;padding:0 10px;font-size:16px;
    font-variant-numeric: tabular-nums;
    -webkit-appearance:none;appearance:none;
    display:block;
  }
  input::placeholder{color:#5c574f;}
  input:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 2px rgba(217,138,61,.2);}
  .btn{
    appearance:none;border:none;border-radius:7px;padding:10px 16px;
    font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;
  }
  .btn:active{opacity:.75;}
  .btn-primary{background:var(--copper);color:#1c1b1a;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

  /* 歷史列表 */
  .period-item{
    border:1px solid var(--line-soft);border-radius:8px;padding:12px;margin-bottom:10px;
    background:var(--panel-2);
  }
  .period-item .row1{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;}
  .period-item .range{font-size:13px;font-weight:600;}
  .period-item .baseline-tag{font-size:11px;color:var(--muted);}
  .period-item .usage-line{
    display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:12px;color:var(--muted);
  }
  .period-item .usage-line b{color:var(--text);font-variant-numeric: tabular-nums;}
  .payable{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
    display:flex;justify-content:space-between;font-size:13px;flex-wrap:wrap;gap:8px;
  }
  .payable .tenant-pay{color:var(--teal);font-weight:700;font-variant-numeric: tabular-nums;}
  .payable .self-pay{color:var(--gold);font-weight:700;font-variant-numeric: tabular-nums;}
  .item-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .item-actions button{font-size:11px;padding:5px 10px;}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}

  .sync-status{font-size:12px;color:var(--muted);margin-top:8px;}
  .sync-status.ok{color:var(--teal);}
  .sync-status.err{color:var(--danger);}

  details summary{cursor:pointer;font-size:12px;color:var(--muted);margin-bottom:10px;}

  .hidden{display:none;}

  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .modal-head h2{font-size:15px;letter-spacing:.04em;font-weight:700;color:var(--text);text-transform:none;}
  .modal-close{
    background:transparent;border:1px solid var(--line);color:var(--text);
    font-size:13px;cursor:pointer;padding:6px 12px;border-radius:6px;
  }
  .modal-divider{height:1px;background:var(--line);margin:14px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-row">
      <div>
        <div class="eyebrow">電費分攤 · 雙月結算</div>
        <h1>電費分攤計算</h1>
        <p>房客電表累積用量,搭配台電本期總度數反推自用用量</p>
      </div>
      <button class="btn-settings" id="btnOpenSettings">⚙ 同步設定</button>
    </div>
    <div class="sync-status" id="syncStatus">尚未同步</div>
  </header>

  <div class="card hidden" id="settingsPanel">
    <div class="modal-head">
      <h2 style="margin:0;">同步設定</h2>
      <button class="modal-close" id="btnCloseSettings" type="button">收合 ▲</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnSync">☁ 從雲端載入</button>
      <button class="btn btn-ghost" id="btnPush">⬆ 上傳目前資料</button>
    </div>

    <div class="modal-divider"></div>

    <div class="btn-row">
      <button class="btn btn-ghost" id="btnExport">匯出備份(JSON)</button>
      <button class="btn btn-ghost" id="btnImportTrigger">匯入備份</button>
      <input type="file" id="fileImport" accept="application/json" class="hidden">
    </div>

    <div class="modal-divider"></div>

    <details>
      <summary>Bin 設定(進階)</summary>
      <div class="form-grid">
        <div class="full">
          <label>Bin ID</label>
          <input type="text" id="cfgBinId">
        </div>
        <div class="full">
          <label>X-Master-Key</label>
          <input type="text" id="cfgBinKey">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="btnSaveCfg">儲存設定</button>
      </div>
    </details>
  </div>

  <div class="card">
    <h2>房客電表最新讀數</h2>
    <div class="meters">
      <div class="meter">
        <div class="label"><span class="dot tenant"></span>房客電表(累積度數)</div>
        <div class="digits" id="tenantDigits"></div>
        <div class="date-note" id="tenantDate">尚無紀錄</div>
      </div>
    </div>
  </div>

  <div class="card" id="latestSplitCard" style="display:none;">
    <h2>最新一期分攤結果</h2>
    <div class="split-summary">
      <div class="split-box tenant">
        <div class="who">房客應付</div>
        <div class="amount" id="latestTenantPay">$0</div>
        <div class="usage" id="latestTenantUsage"></div>
      </div>
      <div class="split-box self">
        <div class="who">自用應付</div>
        <div class="amount" id="latestSelfPay">$0</div>
        <div class="usage" id="latestSelfUsage"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>新增本期紀錄</h2>
    <div class="form-grid">
      <div>
        <label>起始日期</label>
        <input type="date" id="inStart">
      </div>
      <div>
        <label>結束日期(抄表日)</label>
        <input type="date" id="inEnd">
      </div>
      <div class="full">
        <label>房客表讀數(累積度數)</label>
        <input type="number" id="inTenant" placeholder="例如 8075" inputmode="decimal">
      </div>
      <div>
        <label>台電帳單金額(元)</label>
        <input type="number" id="inBillAmount" placeholder="例如 12711" inputmode="decimal">
      </div>
      <div>
        <label>台電本期用電量(度)</label>
        <input type="number" id="inBillKwh" placeholder="例如 2445" inputmode="decimal">
      </div>
      <div>
        <label>台電計費起始日(選填)</label>
        <input type="date" id="inBillPeriodStart">
      </div>
      <div>
        <label>台電計費結束日(選填)</label>
        <input type="date" id="inBillPeriodEnd">
      </div>
      <div class="full">
        <label>台電上期計費用電量(度,選填參考用)</label>
        <input type="number" id="inPrevBillKwh" placeholder="例如 1926" inputmode="decimal">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnAdd">新增紀錄</button>
      <button class="btn btn-ghost hidden" id="btnCancelEdit">取消編輯</button>
    </div>
    <p class="date-note" style="margin-top:10px;">「台電本期用電量」直接抄台電App或帳單上「本期計費用電量」即可,那已經是全戶本期總度數,不用另外抄大表累積讀數。第一筆紀錄僅作為房客表的起始基準,不會計算分攤金額;從第二筆起才會依房客表差值 + 本期總度數自動算出自用/房客各自用量與應付金額。</p>
  </div>

  <div class="card">
    <h2>歷史紀錄</h2>
    <div id="periodList"><div class="empty">尚未有任何紀錄</div></div>
  </div>

</div>

<script>
const DEFAULT_BIN_ID = '6a827a50f5f4af5e291ecf5b';
const DEFAULT_BIN_KEY = '$2a$10$WoK2P8UZkPBUkiXsMKzRFebFXDCbRqXybbhxlVVRcBQQAAKVATRum';

const LS_BIN_ID = 'elec_bin_id';
const LS_BIN_KEY = 'elec_bin_key';
const LS_DATA = 'elec_local_data';

let state = {
  periods: [
    {
      id: "p_baseline_20260816",
      startDate: "2026-06-08",
      endDate: "2026-08-16",
      tenantReading: 8075,
      billAmount: 12711,
      billKwh: 2445,
      billPeriodStart: "2026-06-08",
      billPeriodEnd: "2026-08-09",
      prevBillKwh: 1926
    }
  ]
};
let editingId = null;

function getBinId(){ return localStorage.getItem(LS_BIN_ID) || DEFAULT_BIN_ID; }
function getBinKey(){ return localStorage.getItem(LS_BIN_KEY) || DEFAULT_BIN_KEY; }

function loadLocal(){
  const raw = localStorage.getItem(LS_DATA);
  if(raw){
    try{ state = JSON.parse(raw); }catch(e){ state = {periods:[]}; }
  }
}
function saveLocal(){
  localStorage.setItem(LS_DATA, JSON.stringify(state));
}

function setStatus(msg, cls){
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.className = 'sync-status' + (cls ? ' '+cls : '');
}

async function cloudLoad(){
  setStatus('讀取雲端資料中…');
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${getBinId()}/latest`, {
      headers: { 'X-Master-Key': getBinKey() }
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    const record = json.record;
    if(record && Array.isArray(record.periods)){
      state = record;
      saveLocal();
      renderAll();
      setStatus('已從雲端載入 · '+new Date().toLocaleString('zh-TW'), 'ok');
    }else{
      setStatus('雲端資料格式不符,已略過', 'err');
    }
  }catch(e){
    setStatus('雲端載入失敗:'+e.message, 'err');
  }
}

async function cloudSave(){
  setStatus('上傳中…');
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${getBinId()}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': getBinKey()
      },
      body: JSON.stringify(state)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    setStatus('已上傳雲端 · '+new Date().toLocaleString('zh-TW'), 'ok');
  }catch(e){
    setStatus('上傳失敗:'+e.message, 'err');
  }
}

function sortedPeriods(){
  return [...state.periods].sort((a,b)=> a.endDate.localeCompare(b.endDate));
}

function renderDigits(containerId, value){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  if(value === undefined || value === null || value === ''){
    el.innerHTML = '<span style="color:var(--muted);font-size:13px;">—</span>';
    return;
  }
  const str = String(value);
  for(const ch of str){
    const d = document.createElement('div');
    d.className = 'digit';
    d.textContent = ch;
    el.appendChild(d);
  }
}

function renderMeters(){
  const sp = sortedPeriods();
  const latest = sp[sp.length-1];
  if(latest){
    renderDigits('tenantDigits', latest.tenantReading);
    document.getElementById('tenantDate').textContent = '抄表日 '+latest.endDate;
  }else{
    renderDigits('tenantDigits', null);
    document.getElementById('tenantDate').textContent = '尚無紀錄';
  }
}

function computePeriod(p, prev){
  if(!prev) return null;
  const tenantUsage = p.tenantReading - prev.tenantReading;
  const totalUsage = p.billKwh || 0;
  const selfUsage = totalUsage - tenantUsage;
  const avgPrice = p.billKwh > 0 ? (p.billAmount / p.billKwh) : 0;
  const tenantPay = tenantUsage * avgPrice;
  const selfPay = (p.billAmount || 0) - tenantPay;
  return { tenantUsage, selfUsage, totalUsage, avgPrice, tenantPay, selfPay };
}

function renderLatestSplit(){
  const sp = sortedPeriods();
  const card = document.getElementById('latestSplitCard');
  if(sp.length < 2){
    card.style.display = 'none';
    return;
  }
  const latest = sp[sp.length-1];
  const prev = sp[sp.length-2];
  const c = computePeriod(latest, prev);
  card.style.display = '';
  document.getElementById('latestTenantPay').textContent = '$' + c.tenantPay.toFixed(0);
  document.getElementById('latestSelfPay').textContent = '$' + c.selfPay.toFixed(0);
  document.getElementById('latestTenantUsage').textContent = c.tenantUsage + ' 度';
  document.getElementById('latestSelfUsage').textContent = c.selfUsage + ' 度';
}

function renderList(){
  const listEl = document.getElementById('periodList');
  const sp = sortedPeriods();
  if(sp.length === 0){
    listEl.innerHTML = '<div class="empty">尚未有任何紀錄</div>';
    return;
  }
  listEl.innerHTML = '';
  for(let i = sp.length - 1; i >= 0; i--){
    const p = sp[i];
    const prev = i > 0 ? sp[i-1] : null;
    const item = document.createElement('div');
    item.className = 'period-item';

    let usageBlock = '<span class="baseline-tag">起始基準紀錄,尚無用電量</span>';
    let payableBlock = '';
    let refBlock = '';

    if(p.billPeriodStart || p.billPeriodEnd || p.prevBillKwh || p.billAmount){
      const parts = [];
      if(p.billPeriodStart && p.billPeriodEnd) parts.push(`台電計費期間 ${p.billPeriodStart} ~ ${p.billPeriodEnd}`);
      if(p.billAmount) parts.push(`帳單金額 <b>$${p.billAmount.toLocaleString()}</b>`);
      if(p.billKwh) parts.push(`本期計費 <b>${p.billKwh}</b> 度`);
      if(p.prevBillKwh) parts.push(`上期計費 <b>${p.prevBillKwh}</b> 度`);
      refBlock = `<div class="usage-line" style="margin-top:6px;">${parts.map(t=>`<span>${t}</span>`).join('')}</div>`;
    }

    const c = computePeriod(p, prev);
    if(c){
      usageBlock = `
        <div class="usage-line">
          <span>全戶本期 <b>${c.totalUsage}</b> 度</span>
          <span>房客用量 <b>${c.tenantUsage}</b> 度</span>
          <span>自用用量 <b>${c.selfUsage}</b> 度</span>
          <span>平均電價 <b>${c.avgPrice.toFixed(2)}</b> 元/度</span>
        </div>`;
      payableBlock = `
        <div class="payable">
          <span>房客應付 <span class="tenant-pay">$${c.tenantPay.toFixed(0)}</span></span>
          <span>自用應付 <span class="self-pay">$${c.selfPay.toFixed(0)}</span></span>
        </div>`;
    }

    item.innerHTML = `
      <div class="row1">
        <div class="range">${p.startDate} ~ ${p.endDate}</div>
      </div>
      ${usageBlock}
      ${refBlock}
      ${payableBlock}
      <div class="item-actions">
        <button class="btn btn-ghost" onclick="startEdit('${p.id}')">編輯</button>
        <button class="btn btn-danger" onclick="deletePeriod('${p.id}')">刪除</button>
      </div>
    `;
    listEl.appendChild(item);
  }
}

function renderAll(){
  renderMeters();
  renderLatestSplit();
  renderList();
}

function clearForm(){
  document.getElementById('inStart').value = '';
  document.getElementById('inEnd').value = '';
  document.getElementById('inTenant').value = '';
  document.getElementById('inBillAmount').value = '';
  document.getElementById('inBillKwh').value = '';
  document.getElementById('inBillPeriodStart').value = '';
  document.getElementById('inBillPeriodEnd').value = '';
  document.getElementById('inPrevBillKwh').value = '';
  editingId = null;
  document.getElementById('btnAdd').textContent = '新增紀錄';
  document.getElementById('btnCancelEdit').classList.add('hidden');
}

function startEdit(id){
  const p = state.periods.find(x => x.id === id);
  if(!p) return;
  document.getElementById('inStart').value = p.startDate;
  document.getElementById('inEnd').value = p.endDate;
  document.getElementById('inTenant').value = p.tenantReading;
  document.getElementById('inBillAmount').value = p.billAmount || '';
  document.getElementById('inBillKwh').value = p.billKwh || '';
  document.getElementById('inBillPeriodStart').value = p.billPeriodStart || '';
  document.getElementById('inBillPeriodEnd').value = p.billPeriodEnd || '';
  document.getElementById('inPrevBillKwh').value = p.prevBillKwh || '';
  editingId = id;
  document.getElementById('btnAdd').textContent = '儲存修改';
  document.getElementById('btnCancelEdit').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

function deletePeriod(id){
  if(!confirm('確定要刪除這筆紀錄?')) return;
  state.periods = state.periods.filter(x => x.id !== id);
  saveLocal();
  renderAll();
}

function addOrUpdate(){
  const startDate = document.getElementById('inStart').value;
  const endDate = document.getElementById('inEnd').value;
  const tenantReading = parseFloat(document.getElementById('inTenant').value);
  const billAmount = parseFloat(document.getElementById('inBillAmount').value) || 0;
  const billKwh = parseFloat(document.getElementById('inBillKwh').value) || 0;
  const billPeriodStart = document.getElementById('inBillPeriodStart').value;
  const billPeriodEnd = document.getElementById('inBillPeriodEnd').value;
  const prevBillKwh = parseFloat(document.getElementById('inPrevBillKwh').value) || 0;

  if(!startDate || !endDate || isNaN(tenantReading)){
    alert('請至少填寫起訖日期與房客電表讀數');
    return;
  }

  if(editingId){
    const p = state.periods.find(x => x.id === editingId);
    Object.assign(p, {startDate, endDate, tenantReading, billAmount, billKwh, billPeriodStart, billPeriodEnd, prevBillKwh});
  }else{
    state.periods.push({
      id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      startDate, endDate, tenantReading, billAmount, billKwh, billPeriodStart, billPeriodEnd, prevBillKwh
    });
  }
  saveLocal();
  clearForm();
  renderAll();
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '電費分攤備份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data.periods)) throw new Error('格式不正確');
      state = data;
      saveLocal();
      renderAll();
      setStatus('已匯入本機備份檔', 'ok');
    }catch(err){
      alert('匯入失敗:'+err.message);
    }
  };
  reader.readAsText(file);
}

// 事件綁定
document.getElementById('btnAdd').addEventListener('click', addOrUpdate);
document.getElementById('btnCancelEdit').addEventListener('click', clearForm);
document.getElementById('btnSync').addEventListener('click', cloudLoad);
document.getElementById('btnPush').addEventListener('click', cloudSave);
document.getElementById('btnExport').addEventListener('click', exportBackup);
document.getElementById('btnImportTrigger').addEventListener('click', () => document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', (e) => {
  if(e.target.files[0]) importBackup(e.target.files[0]);
});
document.getElementById('btnSaveCfg').addEventListener('click', () => {
  const id = document.getElementById('cfgBinId').value.trim();
  const key = document.getElementById('cfgBinKey').value.trim();
  if(id) localStorage.setItem(LS_BIN_ID, id);
  if(key) localStorage.setItem(LS_BIN_KEY, key);
  setStatus('已儲存 Bin 設定', 'ok');
});

// 同步設定面板 展開/收合(直接在頁面內,不用彈窗)
const settingsPanel = document.getElementById('settingsPanel');
function closeSettings(){ settingsPanel.classList.add('hidden'); }
function openSettings(){ settingsPanel.classList.remove('hidden'); settingsPanel.scrollIntoView({behavior:'smooth', block:'start'}); }
function toggleSettings(){ settingsPanel.classList.contains('hidden') ? openSettings() : closeSettings(); }
document.getElementById('btnOpenSettings').addEventListener('click', toggleSettings);
document.getElementById('btnCloseSettings').addEventListener('click', closeSettings);

// 初始化
document.getElementById('cfgBinId').value = getBinId();
document.getElementById('cfgBinKey').value = getBinKey();
loadLocal();
renderAll();
cloudLoad();
</script>
</body>
</html>
